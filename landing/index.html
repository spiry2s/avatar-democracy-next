<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avatar Democracy</title>
  <meta name="description" content="Avatar Democracy is a closed demo. Citizens configure an Avatar, review what it reads, and override it. An invitation is required.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/landing/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/landing/style.css">
</head>
<body id="public-landing">
  <a class="skip" href="#content">Skip to content</a>
  <main id="content" class="stage">
    <p class="brand">Avatar Democracy</p>
    <div class="layout">
      <div class="copy">
        <p class="status">This demo is closed</p>
        <h1>Bringing direct democracy into the 21st century</h1>
        <p class="premise">Citizens configure an Avatar, review what it reads, and override it.</p>
        <p class="gate">An invitation is required.</p>
        <a class="enter" href="/invite">Continue to the demo</a>
      </div>
      <svg class="net" viewBox="0 0 640 640" role="img" aria-label="Abstract network of citizens linked to one Avatar">
        <g class="links" fill="none" stroke="currentColor" stroke-width="1.25">
          <path class="link" d="M320 300 L140 150" />
          <path class="link" d="M320 300 L500 130" />
          <path class="link" d="M320 300 L560 310" />
          <path class="link" d="M320 300 L470 520" />
          <path class="link" d="M320 300 L170 500" />
          <path class="link" d="M320 300 L90 330" />
          <path class="link dim" d="M140 150 L90 330" />
          <path class="link dim" d="M500 130 L560 310" />
          <path class="link dim" d="M170 500 L470 520" />
        </g>
        <g class="nodes" fill="currentColor">
          <circle class="node" cx="140" cy="150" r="5" />
          <circle class="node" cx="500" cy="130" r="4" />
          <circle class="node" cx="560" cy="310" r="5" />
          <circle class="node" cx="470" cy="520" r="4" />
          <circle class="node" cx="170" cy="500" r="5" />
          <circle class="node" cx="90" cy="330" r="4" />
          <circle class="core" cx="320" cy="300" r="16" />
          <circle class="core-ring" cx="320" cy="300" r="34" fill="none" stroke="currentColor" stroke-width="1.5" />
        </g>
      </svg>
    </div>
  </main>
</body>
</html>
